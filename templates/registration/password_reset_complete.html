{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zestora - Password Reset Complete</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
    <a href="{% url 'home' %}">
        <div class="logo">Zestora</div>
    </a>
    
    <div class="login-container">
        <div class="welcome-text">Success!</div>
        <h1 class="login-title">Password Reset</h1>
        
        <div class="alert alert-success">
            Your password has been successfully reset! You can now log in with your new password.
        </div>
        
        <div style="text-align: center;">
            <a href="{% url 'login' %}" class="login-btn" style="display: inline-block; text-decoration: none; text-align: center;">
                LOGIN NOW
            </a>
        </div>
    </div>
</body>
</html>
