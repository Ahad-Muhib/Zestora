{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zestora - Set New Password</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
    <a href="{% url 'home' %}">
        <div class="logo">Zestora</div>
    </a>
    
    <div class="login-container">
        <div class="welcome-text">Reset Password</div>
        <h1 class="login-title">Set New Password</h1>
        
        {% if form.errors %}
            {% for field, errors in form.errors.items %}
                {% for error in errors %}
                    <div class="alert alert-error">
                        {{ error }}
                    </div>
                {% endfor %}
            {% endfor %}
        {% endif %}
        
        <p style="color: #666; margin-bottom: 20px; font-size: 14px;">
            Please enter your new password below.
        </p>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label">New Password</label>
                <div class="password-input-container">
                    <input type="password" name="new_password1" id="new-password1" class="form-input" placeholder="Enter new password" required>
                    <button type="button" class="password-toggle" onclick="togglePassword1()">
                        <span id="password1-toggle-text">Show</span>
                    </button>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Confirm New Password</label>
                <div class="password-input-container">
                    <input type="password" name="new_password2" id="new-password2" class="form-input" placeholder="Confirm new password" required>
                    <button type="button" class="password-toggle" onclick="togglePassword2()">
                        <span id="password2-toggle-text">Show</span>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="login-btn">RESET PASSWORD</button>
        </form>
    </div>

    <script>
        function togglePassword1() {
            const passwordInput = document.getElementById('new-password1');
            const toggleText = document.getElementById('password1-toggle-text');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleText.textContent = 'Hide';
            } else {
                passwordInput.type = 'password';
                toggleText.textContent = 'Show';
            }
        }

        function togglePassword2() {
            const passwordInput = document.getElementById('new-password2');
            const toggleText = document.getElementById('password2-toggle-text');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleText.textContent = 'Hide';
            } else {
                passwordInput.type = 'password';
                toggleText.textContent = 'Show';
            }
        }
    </script>

    <style>
        .password-input-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .password-input-container .form-input {
            padding-right: 55px;
        }
        
        .password-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            color: #007bff;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 24px;
            z-index: 2;
            text-decoration: none;
        }
        
        .password-toggle:hover {
            opacity: 0.7;
        }
        
        .password-toggle:focus {
            outline: none;
        }
    </style>
</body>
</html>
