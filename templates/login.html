{% load static %}
{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zestora - Log in</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">

</head>
<body>
  <a href="{%url 'home'%}">
  <div class="logo">Zestora</div>
</a>
    <a href="{% url 'signup' %}" class="account-link">No Account?<br>Sign up</a>
    
    <div class="login-container">
        <div class="welcome-text">Welcome to Zestora</div>
        <h1 class="login-title">Log in</h1>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Enter your username/email</label>
                <input type="text" name="username" class="form-input" placeholder="username or email address" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Enter your Password</label>
                <div class="password-input-container">
                    <input type="password" name="password" id="password" class="form-input" placeholder="Password" required>
                    <button type="button" class="password-toggle" onclick="togglePassword()">
                        <span id="password-toggle-text">Show</span>
                    </button>
                </div>
                <a href="{% url 'password_reset' %}" class="forgot-password">Forgot Password?</a>
                <div style="clear: both;"></div>
            </div>
            
            <button type="submit" class="login-btn">LOGIN</button>
        </form>
        <div class="divider">
            <span>OR</span>
        </div>
        
        <a href="/accounts/google/login/" class="google-btn">
            <div class="google-icon"></div>
            Sign in with Google
        </a>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleText = document.getElementById('password-toggle-text');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleText.textContent = 'Hide';
            } else {
                passwordInput.type = 'password';
                toggleText.textContent = 'Show';
            }
        }
    </script>

    <style>
        .password-input-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .password-input-container .form-input {
            padding-right: 55px;
        }
        
        .password-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            color: #007bff;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 24px;
            z-index: 2;
            text-decoration: none;
        }
        
        .password-toggle:hover {
            opacity: 0.7;
        }
        
        .password-toggle:focus {
            outline: none;
        }
    </style>
</body>
</html>
